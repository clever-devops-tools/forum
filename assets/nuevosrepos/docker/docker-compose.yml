services:
  postgres-app:
    image: postgres:16
    container_name: postgres-app
    environment:
      POSTGRES_DB: personasdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d personasdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  middle-app:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: middle-app
    working_dir: /workspace/middle
    command: mvn spring-boot:run
    environment:
      SERVER_PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ../../../middle:/workspace/middle
      - middle_m2_cache:/root/.m2
    depends_on:
      - postgres-app

  frontend-app:
    image: node:20-bookworm
    container_name: frontend-app
    working_dir: /workspace/frontend
    command: sh -lc "npm install && npm run start"
    ports:
      - "4200:4200"
    volumes:
      - ../../../frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - middle-app

volumes:
  postgres_app_data:
  middle_m2_cache:
  frontend_node_modules:
